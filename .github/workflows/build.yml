name: Build

# 自动触发构建：推送到任意分支 / PR / 手动运行都构建
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      # CURSEFORGE_TOKEN / MODRINTH_TOKEN 只在发布时需要；CI 构建这里用占位空值，
      # 让 publishMods{curseforge{}} 这段 DSL 能解析，build 任务本身不发布不受影响。
      - name: Build mod
        run: ./gradlew build --no-daemon
        env:
          ORG_GRADLE_PROJECT_CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          ORG_GRADLE_PROJECT_MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: maid_storage_manager-1.15.6
          path: build/libs/*.jar
          if-no-files-found: error
